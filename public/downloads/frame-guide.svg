<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><defs><pattern id="check" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#f4f4ee"/><path d="M0 0h15v15H0zM15 15h15v15H15z" fill="#e5e7dc"/></pattern></defs><rect width="1000" height="1500" rx="60" fill="#759875"/><rect x="55" y="55" width="890" height="1390" rx="12" fill="url(#check)"/><g fill="#193a33" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="112" font-size="32" font-weight="bold">HoloRecall · 2:3 frame guide</text><text x="500" y="153" font-size="23">1000 × 1500 px · raster upload: PNG / WebP / JPEG</text><rect x="90" y="190" width="820" height="715" rx="20" stroke="#285c49" stroke-width="4" stroke-dasharray="14 10" fill="#f3e9d5"/><text x="500" y="484" font-size="34" font-weight="bold">Learning illustration</text><text x="500" y="530" font-size="25">Artwork stays separate from your frame.</text><text x="500" y="570" font-size="25">Keep this opening transparent.</text><text x="500" y="634" font-size="21">Bundled illustrations: 800 × 600 px, fit inside.</text><rect x="90" y="944" width="820" height="330" rx="20" stroke="#a85d42" stroke-width="4" stroke-dasharray="14 10" fill="#f9eddd"/><text x="500" y="1063" font-size="32" font-weight="bold">Protected answer / prompt area</text><text x="500" y="1110" font-size="24">Never put essential artwork or text here.</text><text x="500" y="1151" font-size="24">The app covers this area for readability.</text><text x="500" y="1201" font-size="21">Front/back layout adjusts to content length.</text><text x="500" y="1340" font-size="23" font-weight="bold">Frame artwork belongs in the outer 55 px band.</text><text x="500" y="1380" font-size="21">Transparent PNG recommended. Export sRGB, no active content.</text><text x="500" y="1477" font-size="19" fill="#fff">Reference guide only · upload frame-guide-transparent.png as your starting frame</text></g></svg>